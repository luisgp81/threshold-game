name: Build Android APK

on:
  push:
    branches:
      - claude/build-threshold-game-Z5XWk
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip build-essential git \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev openjdk-17-jdk \
            unzip zip autoconf libtool pkg-config cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('threshold_game/buildozer.spec') }}
          restore-keys: buildozer-global-${{ runner.os }}-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/packages
          key: android-sdk-${{ runner.os }}-api33-ndk25b
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Build APK with Buildozer
        working-directory: threshold_game
        run: buildozer android debug 2>&1 | tee build.log
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Rename APK
        id: apk
        working-directory: threshold_game
        run: |
          APK=$(find bin/ -name "*.apk" | head -1)
          NEW="bin/THRESHOLD-GlobalCrisis-v1.0-debug.apk"
          cp "$APK" "$NEW"
          echo "path=$NEW" >> $GITHUB_OUTPUT
          echo "size=$(du -h $NEW | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: THRESHOLD-GlobalCrisis-debug
          path: threshold_game/bin/THRESHOLD-GlobalCrisis-v1.0-debug.apk
          retention-days: 30

      - name: Create or update GitHub Release
        run: |
          APK="threshold_game/bin/THRESHOLD-GlobalCrisis-v1.0-debug.apk"
          TAG="v1.0-android"
          NOTES="## THRESHOLD: Global Crisis — Android APK

          ### Instalación
          1. Descarga el archivo \`.apk\` de abajo
          2. En tu móvil: **Ajustes → Seguridad → Instalar apps desconocidas** (actívalo)
          3. Abre el \`.apk\` y pulsa **Instalar**

          ### Controles táctiles
          - Toca un evento en la lista para responder
          - Toca una región en el mapa para ver detalles
          - **END TURN** — finaliza la semana
          - **LOG** — historial de decisiones
          - **MENU** — ajustes
          - Botón Atrás de Android — pantalla anterior
          - Desliza en el LOG para navegar

          ### Requisitos
          - Android 8.0 (API 26) o superior
          - ~50 MB de espacio libre"

          # Borra el release anterior si existe
          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" || true

          # Borra el tag si existe
          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG" || true

          # Crea el release
          RELEASE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"THRESHOLD: Global Crisis v1.0 — Android APK\",
              \"body\": $(echo "$NOTES" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
              \"draft\": false,
              \"prerelease\": false
            }")

          UPLOAD_URL=$(echo "$RELEASE" | python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["upload_url"])' | sed 's/{?name,label}//')

          # Sube el APK
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "${UPLOAD_URL}?name=THRESHOLD-GlobalCrisis-v1.0-debug.apk"

          echo "✅ Release publicado en:"
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: threshold_game/build.log
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## ✅ APK generado y publicado" >> $GITHUB_STEP_SUMMARY
          echo "**Tamaño:** ${{ steps.apk.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Descarga:** https://github.com/${{ github.repository }}/releases/tag/v1.0-android" >> $GITHUB_STEP_SUMMARY
