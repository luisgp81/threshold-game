name: Build Android APK

on:
  push:
    branches:
      - claude/build-threshold-game-Z5XWk
      - main
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('threshold_game/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/packages
          key: android-sdk-${{ runner.os }}-api33-ndk25b
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Build APK with Buildozer
        working-directory: threshold_game
        run: |
          buildozer android debug 2>&1 | tee build.log
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Find APK
        id: find_apk
        working-directory: threshold_game
        run: |
          APK=$(find bin/ -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh bin/ || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: THRESHOLD-GlobalCrisis-debug
          path: threshold_game/bin/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: threshold_game/build.log
          retention-days: 7

      - name: APK info
        if: success()
        working-directory: threshold_game
        run: |
          APK=$(find bin/ -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            echo "✅ APK generado correctamente"
            echo "📦 Tamaño: $(du -h "$APK" | cut -f1)"
            echo "📁 Archivo: $APK"
          fi
