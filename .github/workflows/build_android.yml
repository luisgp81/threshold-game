name: Build Android APK

on:
  push:
    branches:
      - claude/build-threshold-game-Z5XWk
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK via kivy/buildozer Docker image
        run: |
          set -o pipefail
          docker run --rm \
            -v ${{ github.workspace }}/threshold_game:/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug 2>&1 | tee ${{ github.workspace }}/threshold_game/build.log
          echo "Docker exit code: $?"

      - name: List workspace after build
        if: always()
        run: |
          LOG="${{ github.workspace }}/threshold_game/build.log"
          echo "=== APKs encontrados ==="
          find ${{ github.workspace }} -name "*.apk" 2>/dev/null || echo "Ningún APK"
          echo ""
          echo "=== ERROR REAL (p4a toolchain) ==="
          grep -n -A3 \
            -E "(recipe for|Could not find|No module named|ImportError|ModuleNotFoundError|undefined reference|error:.*ld|cannot find -l|fatal error:|PermissionError|ConnectionError|HTTPError|pip.*error|pkg.*not found)" \
            "$LOG" 2>/dev/null | grep -v "^#" | head -80 || echo "(nada encontrado con grep1)"
          echo ""
          echo "=== TRACEBACK ==="
          grep -n -A5 "Traceback\|Exception\|Error:" "$LOG" 2>/dev/null \
            | grep -v "^#" | head -60 || echo "(sin traceback)"
          echo ""
          echo "=== Últimas 50 líneas del log ==="
          tail -50 "$LOG" 2>/dev/null || echo "Sin log"

      - name: Find APK
        id: apk
        run: |
          echo "=== Buscando APK ==="
          find ${{ github.workspace }}/threshold_game -name "*.apk" 2>/dev/null
          APK=$(find ${{ github.workspace }}/threshold_game -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK encontrado"
            exit 1
          fi
          echo "APK: $APK ($(du -h $APK | cut -f1))"
          DEST="${{ github.workspace }}/threshold_game/THRESHOLD-GlobalCrisis-v1.0-debug.apk"
          cp "$APK" "$DEST"
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          echo "size=$(du -h $DEST | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: THRESHOLD-GlobalCrisis-debug
          path: threshold_game/THRESHOLD-GlobalCrisis-v1.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        run: |
          APK="${{ github.workspace }}/threshold_game/THRESHOLD-GlobalCrisis-v1.0-debug.apk"
          TAG="v1.0-android"

          # Borrar release y tag previos si existen
          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" || true
          sleep 2
          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG" || true
          sleep 2

          NOTES="## THRESHOLD: Global Crisis — Android APK

          ### Instalación
          1. Descarga el archivo \`.apk\` de abajo
          2. En tu móvil: **Ajustes → Seguridad → Instalar apps desconocidas** (actívalo para tu navegador)
          3. Abre el \`.apk\` y pulsa **Instalar**

          ### Controles táctiles
          - Toca un evento en la lista inferior para responder
          - Toca una región en el mapa para ver detalles
          - **END TURN** — finaliza la semana
          - **LOG** — historial de decisiones
          - **MENU** — ajustes y dificultad
          - Botón Atrás de Android — pantalla anterior
          - Desliza en el LOG para navegar

          ### Requisitos
          - Android 8.0 (API 26) o superior
          - ~60 MB de espacio libre"

          RELEASE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"THRESHOLD: Global Crisis v1.0 — Android APK\",
              \"body\": $(echo "$NOTES" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
              \"draft\": false,
              \"prerelease\": false
            }")

          UPLOAD_URL=$(echo "$RELEASE" | python3 -c \
            'import json,sys; print(json.loads(sys.stdin.read()).get("upload_url",""))' \
            | sed 's/{?name,label}//')

          if [ -z "$UPLOAD_URL" ]; then
            echo "Error creando release: $RELEASE"
            exit 1
          fi

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "${UPLOAD_URL}?name=THRESHOLD-GlobalCrisis-v1.0-debug.apk"

          echo "✅ Release publicado:"
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: threshold_game/build.log
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## ✅ APK compilado y publicado" >> $GITHUB_STEP_SUMMARY
          echo "**Tamaño:** ${{ steps.apk.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Descarga:** https://github.com/${{ github.repository }}/releases/tag/v1.0-android" >> $GITHUB_STEP_SUMMARY
