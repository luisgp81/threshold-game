name: Build Windows EXE

on:
  push:
    branches: ["claude/build-threshold-game-Z5XWk"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pygame pyinstaller

      - name: Build EXE with PyInstaller
        working-directory: threshold_game
        shell: bash
        run: |
          python -m PyInstaller \
            --onedir \
            --windowed \
            --name=THRESHOLD_GlobalCrisis \
            "--add-data=data;data" \
            "--add-data=assets;assets" \
            --hidden-import=pygame \
            --hidden-import=pygame.font \
            --hidden-import=pygame.mixer \
            --hidden-import=json \
            --clean \
            --noconfirm \
            main.py

      - name: List output
        shell: bash
        run: |
          echo "=== dist contents ==="
          ls -la threshold_game/dist/THRESHOLD_GlobalCrisis/ || echo "dist folder not found"
          echo "=== looking for exe ==="
          find threshold_game/dist -name "*.exe" 2>/dev/null || echo "no exe found"

      - name: Zip the build
        shell: bash
        run: |
          cd threshold_game/dist
          7z a -tzip ../../THRESHOLD-Windows.zip THRESHOLD_GlobalCrisis/
          cd ../..
          ls -la THRESHOLD-Windows.zip

      - name: Delete old release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v1.0-windows --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release with EXE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create v1.0-windows \
            THRESHOLD-Windows.zip \
            --title "THRESHOLD: Global Crisis — Windows PC" \
            --notes "## Instalación
          1. Descarga **THRESHOLD-Windows.zip**
          2. Extrae la carpeta THRESHOLD_GlobalCrisis
          3. Ejecuta **THRESHOLD_GlobalCrisis.exe**

          No necesita instalar Python ni ninguna dependencia.

          ### Controles
          - **Clic** en eventos para responder
          - **F11** — pantalla completa
          - **Rueda del ratón** — scroll en el log"
